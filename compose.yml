# CARACAL Fleet - self-hosted deployment.
#
#   cp .env.example .env        # optional, all settings have defaults
#   docker compose up -d                      # http://<server>:8090
#   docker compose --profile https up -d      # + automatic HTTPS (Let's Encrypt) for CARACAL_HUB_DOMAIN
#
# On the first start without CARACAL_HUB_ADMIN_PASSWORD, open the web UI and create the administrator with the
# one-time setup code from the log:  docker compose logs hub | grep "SETUP CODE"
name: caracal-fleet

services:
  hub:
    image: ${CARACAL_HUB_IMAGE:-ghcr.io/gelluithor/caracal-fleet}:${CARACAL_HUB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${CARACAL_HUB_PORT:-8090}:8090"
    volumes:
      - hub-data:/var/lib/caracal-hub
      # Updates from the web UI (Settings -> Fleet update): the hub replaces its own container. Whoever controls the
      # Docker socket controls the server, so this is opt-in; without it the UI shows the commands to run.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CARACAL_NODE_IMAGE: ${CARACAL_NODE_IMAGE:-ghcr.io/gelluithor/caracal-node}
      CARACAL_HUB_ADMIN_PASSWORD: ${CARACAL_HUB_ADMIN_PASSWORD:-}
      CARACAL_HUB_ENROLL_TOKEN: ${CARACAL_HUB_ENROLL_TOKEN:-}
      CARACAL_HUB_PROXY_CACHE_GB: ${CARACAL_HUB_PROXY_CACHE_GB:-20}
      CARACAL_HUB_APT_HOSTS: ${CARACAL_HUB_APT_HOSTS:-}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # Reverse proxy with automatic Let's Encrypt certificates. The domain must point to this server and
  # ports 80 and 443 must be reachable from the internet (for an internal CA, edit deploy/Caddyfile).
  caddy:
    profiles: [https]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CARACAL_HUB_DOMAIN: ${CARACAL_HUB_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [hub]

  # A local language model for the assistant (Ollama), for servers with power to spare; the assistant works without it
  # (built-in help). It loads the model only while it answers and frees the memory after a few idle minutes. Opt-in:
  #   docker compose --profile assistant up -d     then Settings -> Assistant -> Local model -> Download the model
  assistant:
    profiles: [assistant]
    image: ${CARACAL_ASSISTANT_IMAGE:-ollama/ollama:0.40.13}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${CARACAL_ASSISTANT_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - assistant-models:/root/.ollama
    # only the hub talks to it (no published port); at most two CPU cores, so the hub stays responsive
    cpus: ${CARACAL_ASSISTANT_CPUS:-2}
    mem_limit: ${CARACAL_ASSISTANT_MEMORY:-2g}

volumes:
  hub-data:
  assistant-models:
  caddy-data:
  caddy-config:
