<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARACAL widget</title>
<style>
  :root { --bg: #10131a; --panel: #1a1f2a; --text: #f4f6fa; --muted: #9aa3b5; --line: #2a3140; --accent: #f26b1d; }
  body.light { --bg: #f5f6f8; --panel: #ffffff; --text: #141821; --muted: #5d6677; --line: #dfe3ea; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "DejaVu Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #w { position: absolute; inset: 0; padding: 6vh 5vw; display: flex; flex-direction: column; box-sizing: border-box; }
  .title { font-size: 4.2vh; font-weight: 700; color: var(--accent); margin: 0 0 3vh; letter-spacing: .02em; }
  .error { margin: auto; font-size: 3.4vh; color: var(--muted); text-align: center; max-width: 70vw; }
  /* clock */
  .clock { margin: auto; text-align: center; }
  .clock .time { font-size: 30vh; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .clock .time small { font-size: .35em; color: var(--muted); margin-left: .2em; }
  .clock .date { font-size: 6vh; color: var(--muted); margin-top: 3vh; }
  .clock .date::first-letter { text-transform: uppercase; }
  /* weather */
  .wx-now { display: flex; align-items: center; gap: 4vw; flex: 1; }
  .wx-icon { font-size: 28vh; line-height: 1; }
  .wx-temp { font-size: 22vh; font-weight: 700; line-height: 1; }
  .wx-text { font-size: 5vh; margin-top: 1.5vh; }
  .wx-meta { font-size: 3.4vh; color: var(--muted); margin-top: 1.5vh; }
  .wx-days { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 2vw; }
  .wx-day { background: var(--panel); border-radius: 2vh; padding: 2.5vh 1vw; text-align: center; }
  .wx-day b { display: block; font-size: 3.2vh; color: var(--muted); font-weight: 600; }
  .wx-day span { display: block; font-size: 8vh; line-height: 1.2; }
  .wx-day i { font-style: normal; font-size: 3.8vh; }
  .wx-day i em { font-style: normal; color: var(--muted); }
  /* news */
  .news { display: grid; grid-template-columns: 1.25fr 1fr; gap: 4vw; flex: 1; min-height: 0; }
  .news.noimg { grid-template-columns: 1fr; }
  .lead h2 { font-size: 6.4vh; line-height: 1.15; margin: 0 0 2.5vh; }
  .lead p { font-size: 3.4vh; line-height: 1.45; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .lead img { width: 100%; max-height: 38vh; object-fit: cover; border-radius: 2vh; margin-bottom: 3vh; }
  .more { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2.4vh; overflow: hidden; }
  .more li { border-left: .6vh solid var(--accent); padding-left: 1.6vw; font-size: 3.6vh; line-height: 1.3; }
  .more small, .lead small { display: block; font-size: 2.6vh; color: var(--muted); margin-top: .6vh; }
  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 3.6vh; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 2.8vh; padding: 0 1.2vw 1.6vh; border-bottom: .3vh solid var(--accent); }
  td { padding: 1.6vh 1.2vw; border-bottom: 1px solid var(--line); }
  tr:nth-child(even) td { background: var(--panel); }
  .pager { margin-top: auto; padding-top: 2vh; font-size: 2.6vh; color: var(--muted); text-align: right; }
  /* text */
  .text { margin: auto 0; }
  .text h1 { font-size: 10vh; line-height: 1.08; margin: 0 0 4vh; }
  .text p { font-size: 5.4vh; line-height: 1.4; margin: 0; white-space: pre-wrap; max-width: 85vw; }
  .text.center { text-align: center; margin: auto; }
  .bar { height: 1.2vh; width: 12vw; background: var(--accent); border-radius: 1vh; margin-bottom: 5vh; }
  .text.center .bar { margin-inline: auto; }
</style>
</head>
<body>
<div id="w"></div>
<script src="/static/widgets.js"></script>
</body>
</html>
